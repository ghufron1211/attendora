[variables]
NIXPACKS_PHP_ROOT_DIR="/app/public"

[phases.setup]
nixPkgs = ["php", "nodejs", "npm"]

[phases.install]
cmds = [
  "composer install --ignore-platform-req=ext-gd --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
